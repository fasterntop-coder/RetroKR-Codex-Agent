name: Build Cutey Honey FX KR POC01 v0.02
permissions:
  contents: write
on:
  push:
    branches: [tmp-cutey-poc01]
    paths:
      - '.github/workflows/cutey_poc01_v002.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-cutey-poc01
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip golang-go
      - name: Build self-contained Windows patcher
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/v1 /tmp/go-patcher /tmp/pkg
          mkdir -p /tmp/v1 /tmp/go-patcher /tmp/pkg "$GITHUB_WORKSPACE/artifacts"
          unzip -q "$GITHUB_WORKSPACE/artifacts/CuteyHoneyFX_KR_POC01_v0.01.zip" -d /tmp/v1
          cp /tmp/v1/poc01_raw_sectors.bin /tmp/go-patcher/
          cat >/tmp/go-patcher/go.mod <<'EOF'
          module cutey-poc01-patcher
          go 1.20
          EOF
          cat >/tmp/go-patcher/main.go <<'EOF'
          package main

          import (
            "bufio"
            "crypto/sha256"
            _ "embed"
            "encoding/hex"
            "fmt"
            "io"
            "os"
            "path/filepath"
            "strings"
          )

          //go:embed poc01_raw_sectors.bin
          var patch []byte

          const expectedSize int64 = 666356880
          const expectedSHA = "a19b406a85576f7e5e928f3f308307aae6b95a0de87b5be60acb4c68f1c08267"
          const outputSHA = "a381e116de4a53db09ceb6d1f5af4dd02b81976788805275eaf1cc22e5b1c46f"
          const patchOffset int64 = 0x009DBB10

          func pause() {
            fmt.Print("\nPress Enter to close...")
            _, _ = bufio.NewReader(os.Stdin).ReadString('\n')
          }

          func fileSHA(path string) (string, error) {
            f, err := os.Open(path)
            if err != nil { return "", err }
            defer f.Close()
            h := sha256.New()
            if _, err = io.Copy(h, f); err != nil { return "", err }
            return hex.EncodeToString(h.Sum(nil)), nil
          }

          func main() {
            fmt.Println("Cutey Honey FX KR POC01 v0.02 - self-contained patcher")
            fmt.Println("------------------------------------------------------")
            exe, _ := os.Executable()
            exeDir := filepath.Dir(exe)
            var src string
            if len(os.Args) >= 2 { src = strings.Trim(os.Args[1], "\"") } else { src = filepath.Join(exeDir, "Cutey_Honey_FX_JAP.bin") }
            src, _ = filepath.Abs(src)
            st, err := os.Stat(src)
            if err != nil {
              fmt.Println("[ERROR] Original BIN not found:", src)
              fmt.Println("Put Cutey_Honey_FX_JAP.bin in the same folder as this EXE and double-click it,")
              fmt.Println("or drag the original BIN onto this EXE.")
              pause(); return
            }
            if st.Size() != expectedSize { fmt.Printf("[ERROR] Wrong file size: %d (expected %d)\n", st.Size(), expectedSize); pause(); return }
            fmt.Println("[1/4] Checking CLEAN SHA-256...")
            sh, err := fileSHA(src)
            if err != nil { fmt.Println("[ERROR]", err); pause(); return }
            if sh != expectedSHA { fmt.Println("[ERROR] CLEAN SHA-256 mismatch"); fmt.Println("Found:   ", sh); fmt.Println("Expected:", expectedSHA); pause(); return }
            fmt.Println("[PASS] CLEAN verified")
            dst := filepath.Join(filepath.Dir(src), "Cutey_Honey_FX_JAP_KR_POC01.bin")
            fmt.Println("[2/4] Copying original BIN...")
            in, err := os.Open(src)
            if err != nil { fmt.Println("[ERROR]", err); pause(); return }
            out, err := os.Create(dst)
            if err != nil { in.Close(); fmt.Println("[ERROR]", err); pause(); return }
            _, err = io.Copy(out, in)
            in.Close()
            if err != nil { out.Close(); fmt.Println("[ERROR]", err); pause(); return }
            fmt.Printf("[3/4] Writing %d patch bytes at 0x%08X...\n", len(patch), patchOffset)
            if _, err = out.Seek(patchOffset, io.SeekStart); err != nil { out.Close(); fmt.Println("[ERROR]", err); pause(); return }
            if _, err = out.Write(patch); err != nil { out.Close(); fmt.Println("[ERROR]", err); pause(); return }
            if err = out.Close(); err != nil { fmt.Println("[ERROR]", err); pause(); return }
            fmt.Println("[4/4] Verifying patched BIN...")
            osh, err := fileSHA(dst)
            if err != nil { fmt.Println("[ERROR]", err); pause(); return }
            if osh != outputSHA { fmt.Println("[ERROR] Output SHA-256 mismatch"); fmt.Println("Found:   ", osh); fmt.Println("Expected:", outputSHA); pause(); return }
            fmt.Println("\n[PASS] POC01 patch completed successfully.")
            fmt.Println("Output:", dst)
            fmt.Println("Use Cutey_Honey_FX_JAP_KR_POC01.cue to boot it.")
            pause()
          }
          EOF
          cd /tmp/go-patcher
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/pkg/POC01_Patcher.exe .
          test -s /tmp/pkg/POC01_Patcher.exe
          cp /tmp/v1/Cutey_Honey_FX_KR_POC01_v0.01.xdelta /tmp/pkg/
          cp /tmp/v1/Cutey_Honey_FX_JAP_KR_POC01.cue /tmp/pkg/
          cp /tmp/v1/POC01_EXPECTED_PREVIEW.png /tmp/pkg/
          cp /tmp/v1/BUILD_INFO.txt /tmp/pkg/
          cat >/tmp/pkg/README_KO.txt <<'EOF'
          큐티하니 FX PC-FX 한글 출력 POC01 v0.02
          =========================================
          v0.01의 CMD 드래그 인자 문제를 제거한 Windows 독립 실행형 패처입니다.
          Python 필요 없음. BAT 필요 없음.

          가장 쉬운 적용법
          1. CLEAN 원본 파일 이름을 Cutey_Honey_FX_JAP.bin 으로 둡니다.
          2. 원본 BIN과 POC01_Patcher.exe를 같은 폴더에 둡니다.
          3. POC01_Patcher.exe를 더블클릭합니다.
          4. [PASS]가 나오면 Cutey_Honey_FX_JAP_KR_POC01.bin 이 생성됩니다.
          5. 동봉 Cutey_Honey_FX_JAP_KR_POC01.cue와 생성 BIN을 같은 폴더에 두고 CUE로 부팅합니다.

          또는 원본 BIN을 POC01_Patcher.exe 위로 드래그해도 됩니다.

          CLEAN 검증값
          SIZE    666356880 bytes
          SHA-256 a19b406a85576f7e5e928f3f308307aae6b95a0de87b5be60acb4c68f1c08267

          패치 후 SHA-256
          a381e116de4a53db09ceb6d1f5af4dd02b81976788805275eaf1cc22e5b1c46f

          정상 화면: 한글 출력 성공 / CUTIE HONEY FX / KR POC01
          EOF
          (cd /tmp/pkg && sha256sum * > SHA256SUMS.txt)
          rm -f "$GITHUB_WORKSPACE/artifacts/CuteyHoneyFX_KR_POC01_v0.02.zip"
          (cd /tmp/pkg && zip -9 -r "$GITHUB_WORKSPACE/artifacts/CuteyHoneyFX_KR_POC01_v0.02.zip" .)
          sha256sum "$GITHUB_WORKSPACE/artifacts/CuteyHoneyFX_KR_POC01_v0.02.zip"
          ls -lh /tmp/pkg/POC01_Patcher.exe "$GITHUB_WORKSPACE/artifacts/CuteyHoneyFX_KR_POC01_v0.02.zip"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CuteyHoneyFX_KR_POC01_v0.02
          path: artifacts/CuteyHoneyFX_KR_POC01_v0.02.zip
          retention-days: 7
      - name: Commit package to temporary branch
        run: |
          git config user.name 'Cutey POC Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/CuteyHoneyFX_KR_POC01_v0.02.zip
          git commit -m 'artifact: Cutey Honey FX KR POC01 v0.02 [skip ci]'
          git push origin HEAD:tmp-cutey-poc01
