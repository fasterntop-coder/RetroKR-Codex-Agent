name: Cutey Honey FX Persist Report
permissions:
  contents: write
on:
  push:
    branches: [tmp-cutey-poc01]
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-cutey-poc01
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full curl
      - name: Download and parse
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 --fail -o /tmp/cutey.7z 'https://archive.org/download/noaen-redump-nec-pc-fx-pc-fxga/Cutey%20Honey%20FX%20%28Japan%29.7z'
          mkdir -p /tmp/cutey analysis
          7z x -y /tmp/cutey.7z -o/tmp/cutey >/dev/null
          python3 - <<'PY' > analysis/cutey_poc01_static_report.txt
          import pathlib,struct,hashlib,zlib,mmap
          root=pathlib.Path('/tmp/cutey')
          bins=sorted(root.glob('*.bin'))
          t1=next(p for p in bins if 'Track 1' in p.name)
          t2=next(p for p in bins if 'Track 2' in p.name)
          def hashes(p):
            h1=hashlib.sha1();h256=hashlib.sha256();crc=0
            with p.open('rb') as f:
              while True:
                b=f.read(8<<20)
                if not b: break
                h1.update(b);h256.update(b);crc=zlib.crc32(b,crc)
            return f'{crc&0xffffffff:08x}',h1.hexdigest(),h256.hexdigest()
          print('T1_SIZE',t1.stat().st_size); print('T1_HASHES',*hashes(t1))
          print('T2_SIZE',t2.stat().st_size); print('T2_HASHES',*hashes(t2))
          hm=hashlib.sha256()
          for p in (t1,t2):
            with p.open('rb') as f:
              while True:
                b=f.read(8<<20)
                if not b: break
                hm.update(b)
          print('MERGED_SIZE',t1.stat().st_size+t2.stat().st_size)
          print('MERGED_SHA256',hm.hexdigest())
          with t2.open('rb') as f:
            mm=mmap.mmap(f.fileno(),0,access=mmap.ACCESS_READ)
            magic=b'PC-FX:Hu_CD-ROM'; m=mm.find(magic)
            print('MAGIC_TRACK2_OFFSET',hex(m))
            sec0=m-16
            print('TRACK2_DATA_RAW_BASE',hex(sec0))
            print('MERGED_DATA_RAW_BASE',hex(t1.stat().st_size+sec0))
            print('MERGED_DATA_PAYLOAD_BASE',hex(t1.stat().st_size+sec0+16))
            s0=mm[sec0+16:sec0+16+2048]
            s1=mm[sec0+2352+16:sec0+2352+16+2048]
            title=s1[:32].split(b'\0')[0].decode('cp932','replace')
            sect_off,sect_count,prog_load,prog_entry=struct.unpack_from('<IIII',s1,32)
            print('SECTOR0_MAGIC',repr(s0[:32]))
            print('TITLE',repr(title))
            print('BOOT_SECT_OFF',sect_off)
            print('BOOT_SECT_COUNT',sect_count)
            print('PROG_LOAD',hex(prog_load))
            print('PROG_ENTRY',hex(prog_entry))
            print('HEADER_RAW_TRACK2_OFFSET',hex(sec0+2352+16))
            print('HEADER_RAW_MERGED_OFFSET',hex(t1.stat().st_size+sec0+2352+16))
            boot=bytearray()
            for sec in range(sect_off,sect_off+sect_count):
              a=sec0+sec*2352+16; boot += mm[a:a+2048]
            print('BOOT_BYTES',len(boot))
            print('BOOT_SHA256',hashlib.sha256(boot).hexdigest())
            print('BOOT_HEAD_HEX',bytes(boot[:128]).hex())
            for label,text in [('HONEY','如月ハニー'),('SAVE','セーブ'),('LOAD','ロード'),('TRANSFORM','キューティーハニーに変身！')]:
              pat=text.encode('cp932'); hs=[]; pos=0
              while len(hs)<32:
                i=mm.find(pat,pos)
                if i<0: break
                hs.append(i); pos=i+1
              print(label+'_HITS_TRACK2',','.join(hex(x) for x in hs))
              print(label+'_HITS_MERGED',','.join(hex(t1.stat().st_size+x) for x in hs))
            for label,pat in [('ROMFONT_LE',bytes.fromhex('0c00f0ff')),('FFF0_LE',bytes.fromhex('f0ff'))]:
              hs=[];pos=0
              while len(hs)<128:
                i=mm.find(pat,pos)
                if i<0: break
                hs.append(i);pos=i+1
              print(label+'_HITS_TRACK2',','.join(hex(x) for x in hs))
            mm.close()
          PY
          cat analysis/cutey_poc01_static_report.txt
      - name: Commit report
        run: |
          git config user.name 'Cutey POC Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/cutey_poc01_static_report.txt
          git commit -m 'temp: persist Cutey POC01 static report [skip ci]' || exit 0
          git push origin HEAD:tmp-cutey-poc01
