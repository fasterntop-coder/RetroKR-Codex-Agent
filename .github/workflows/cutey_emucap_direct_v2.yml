name: Cutey Honey FX emucap Direct Runtime Trace v2
permissions:
  contents: write
on:
  push:
    branches: [tmp-cutey-poc01]
    paths: ['.github/workflows/cutey_emucap_direct_v2.yml']
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp-cutey-poc01}
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libsdl2-dev libflac-dev libsndfile1-dev liblzo2-dev libmpcdec-dev libzstd-dev zlib1g-dev gettext p7zip-full curl python3 git
      - name: Build pinned emucap Mednafen PC-FX adapter
        run: |
          set -euxo pipefail
          git clone -q https://github.com/mcpads/emucap.git /tmp/emucap
          cd /tmp/emucap;git checkout -q 3887f9e9de7525087c30ca4434d9cb8c3ff15103
          adapters/mednafen/build.sh
          test -x adapters/mednafen/work/mednafen/src/mednafen
          git rev-parse HEAD > /tmp/emucap_commit.txt
      - name: Prepare exact CLEAN game and BIOS
        run: |
          set -euxo pipefail
          curl -L --retry 3 --fail -o /tmp/cutey.7z 'https://archive.org/download/noaen-redump-nec-pc-fx-pc-fxga/Cutey%20Honey%20FX%20%28Japan%29.7z'
          mkdir -p /tmp/game /tmp/dyn analysis/cutey_full
          7z x -y /tmp/cutey.7z -o/tmp/game >/dev/null
          T1=$(find /tmp/game -maxdepth 1 -type f -name '*Track 1*.bin' | head -1);T2=$(find /tmp/game -maxdepth 1 -type f -name '*Track 2*.bin' | head -1)
          echo 'ffae85763f581d312abb6b5096f6f7d62e771aae  '"$T1" | sha1sum -c -;echo '1dd574364e40cb90dd0ff25940fe8df9e6793edf  '"$T2" | sha1sum -c -
          B1=$(basename "$T1");B2=$(basename "$T2");cat >/tmp/game/game.cue <<EOF
          FILE "$B1" BINARY
            TRACK 01 AUDIO
              INDEX 01 00:00:00
          FILE "$B2" BINARY
            TRACK 02 MODE1/2352
              INDEX 00 00:00:00
              INDEX 01 00:03:00
          EOF
          curl -L --retry 3 --fail -o /tmp/pcfx.rom https://raw.githubusercontent.com/Abdess/retrobios/master/bios/NEC/PC-FX/pcfx.rom
          echo '4b44ccf5d84cc83daa2e6a2bee00fdafa14eb58bdf5859e96d8861a891675417  /tmp/pcfx.rom' | sha256sum -c -
      - name: Direct emucap adapter trace
        run: |
          set -euxo pipefail
          cat >/tmp/dyn/drive.py <<'PY'
          import socket,subprocess,os,json,time,select
          port=47800; cue='/tmp/game/game.cue'; root='/tmp/emucap'; out=[]
          srv=socket.socket();srv.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1);srv.bind(('127.0.0.1',port));srv.listen(1);srv.settimeout(120)
          env=os.environ.copy();env.update({'EMUCAP_PCFX_BIOS':'/tmp/pcfx.rom','MEDNAFEN_FORCE_MODULE':'pcfx','EMUCAP_HEADLESS':'1','EMUCAP_START_FROZEN':'1','SDL_VIDEODRIVER':'dummy','SDL_AUDIODRIVER':'dummy'})
          log=open('/tmp/dyn/mednafen.log','w')
          p=subprocess.Popen([root+'/adapters/mednafen/launch.sh',cue,str(port)],cwd=root+'/adapters/mednafen',env=env,stdout=log,stderr=subprocess.STDOUT)
          conn,addr=srv.accept();conn.settimeout(30);f=conn.makefile('rwb',buffering=0);rid=0
          def req(method,params=None,timeout=30):
              global rid;rid+=1
              q={'v':1,'id':rid,'method':method,'params':params or {}};f.write((json.dumps(q,separators=(',',':'))+'\n').encode());deadline=time.time()+timeout
              while time.time()<deadline:
                  line=f.readline()
                  if not line:raise RuntimeError('adapter EOF')
                  v=json.loads(line);out.append({'request':q,'response':v})
                  if v.get('id')==rid:
                      if not v.get('ok',False):raise RuntimeError(method+': '+json.dumps(v))
                      return v.get('result')
              raise TimeoutError(method)
          try:
              hello=req('hello',{})
              methods=hello.get('methods',[]) if isinstance(hello,dict) else []
              out.append({'hello_summary':{'protocol_version':hello.get('protocol_version'),'system':hello.get('system'),'methods':methods,'memory_types':hello.get('memory_types'),'breakpoint_kinds':hello.get('breakpoint_kinds'),'recording':hello.get('recording')}})
              st=req('status',{})
              # Live RAM proof of known system-menu string block.
              if 'read_memory' in methods:
                  out.append({'live_menu_ram':req('read_memory',{'memory_type':'ram','address':0x1821c,'length':0x70})})
              # Catch either of the game's two BIOS ROMFONT call sites.
              bpids=[]
              if 'set_breakpoint' in methods:
                  for a in (0x34944,0x34b46):
                      r=req('set_breakpoint',{'kind':'exec','memory_type':'cpu','start':a,'end':a,'pause_on_hit':True});bpids.append(r)
              if 'set_trace' in methods:req('set_trace',{'enabled':True})
              if 'resume' in methods:req('resume',{})
              # Wait bounded host time for guest to hit a ROMFONT site.
              time.sleep(2)
              out.append({'after_resume_status':req('status',{})})
              if 'poll_events' in methods:out.append({'events':req('poll_events',{})})
              if 'get_state' in methods:out.append({'cpu_at_hit':req('get_state',{'groups':['cpu']})})
              if 'get_trace' in methods:out.append({'trace_at_hit':req('get_trace',{'count':128})})
              if 'call_stack' in methods:
                  try:out.append({'call_stack':req('call_stack',{})})
                  except Exception as e:out.append({'call_stack_error':repr(e)})
              # After proving debugger authority, capture advertised recording/audio-related capabilities for voice work.
              caps={k:v for k,v in hello.items() if any(x in k.lower() for x in ('record','audio','cd','event','break','memory','method'))} if isinstance(hello,dict) else {}
              out.append({'voice_trace_capability_inventory':caps})
          except Exception as e:
              out.append({'fatal':repr(e)})
              raise
          finally:
              open('/tmp/dyn/trace.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
              try:conn.close();srv.close()
              except:pass
              try:p.terminate();p.wait(timeout=5)
              except:
                  try:p.kill()
                  except:pass
              log.close()
          PY
          python3 /tmp/dyn/drive.py
          cp /tmp/dyn/trace.json analysis/cutey_full/EMUCAP_DIRECT_TRACE_v2.json
          cp /tmp/emucap_commit.txt analysis/cutey_full/EMUCAP_COMMIT_v2.txt
          tail -200 /tmp/dyn/mednafen.log > analysis/cutey_full/EMUCAP_MEDNAFEN_LOG_v2.txt
      - name: Commit trace report
        if: always()
        run: |
          if [ -f analysis/cutey_full/EMUCAP_DIRECT_TRACE_v2.json ]; then git config user.name 'Cutey emucap tracer';git config user.email 'actions@users.noreply.github.com';git add analysis/cutey_full/EMUCAP_*_v2.*;git diff --cached --quiet || git commit -m 'analysis: Cutey emucap direct trace v2 [skip ci]';git push origin HEAD:tmp-cutey-poc01;fi
