name: Build Cutey Honey FX Split Track POC01 v0.03 Word Fix
permissions:
  contents: write
on:
  push:
    branches: [tmp-cutey-poc01]
    paths:
      - '.github/workflows/cutey_split_poc01_v003_wordfix.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-cutey-poc01
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip curl git make gcc fonts-nanum python3-pil golang-go
      - name: Install V810 PC-FX toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 --fail -o /tmp/v810.zip https://github.com/jbrandwood/v810-gcc/releases/download/latest/v810-gcc-Linux-x86_64.zip
          mkdir -p /tmp/v810
          unzip -q /tmp/v810.zip -d /tmp/v810
          GCCBIN=$(find /tmp/v810 -type f -name v810-gcc | head -1)
          V810GCC=$(dirname "$(dirname "$GCCBIN")")
          echo "V810GCC=$V810GCC" >> "$GITHUB_ENV"
          echo "$V810GCC/bin" >> "$GITHUB_PATH"
          export V810GCC PATH="$V810GCC/bin:$PATH"
          git clone -q https://github.com/jbrandwood/pcfxtools.git /tmp/pcfxtools
          make -C /tmp/pcfxtools -j2
          cp /tmp/pcfxtools/pcfx-cdlink /tmp/pcfxtools/bincat "$V810GCC/bin/"
          git clone -q https://github.com/jbrandwood/liberis.git /tmp/liberis
          make -C /tmp/liberis -j2
          make -C /tmp/liberis install
      - name: Generate per-word corrected Korean bitmap
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          import os
          W,H=256,96
          im=Image.new('1',(W,H),0); d=ImageDraw.Draw(im)
          fp=next(p for p in ['/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf','/usr/share/fonts/truetype/nanum/NanumGothic.ttf'] if os.path.exists(p))
          def put(t,y,s):
              f=ImageFont.truetype(fp,s); b=d.textbbox((0,0),t,font=f)
              d.text(((W-(b[2]-b[0]))//2,y),t,font=f,fill=1)
          put('한글 출력 성공',6,26)
          put('CUTIE HONEY FX',44,16)
          put('KR POC01 v0.03',66,16)
          im.resize((512,192)).save('/tmp/expected.png')
          words=[]
          for y in range(H):
              for bx in range(32):
                  v=0
                  for x in range(8):
                      if im.getpixel((bx*8+x,y)):
                          v |= 1 << ((7-x)*2)
                  words.append(v)
          out=['#include <eris/types.h>','#include <eris/king.h>','#include <eris/tetsu.h>',f'static const u16 screen_words[{len(words)}]={{']
          for i in range(0,len(words),16): out.append(','.join(f'0x{v:04X}' for v in words[i:i+16])+',')
          out.append('};')
          out.append(r'''
          int main(int argc,char **argv){
            int i,y,x; u16 microprog[16];
            eris_king_init(); eris_tetsu_init();
            eris_tetsu_set_priorities(0,0,1,0,0,0,0);
            eris_tetsu_set_king_palette(0,0,0,0); eris_tetsu_set_rainbow_palette(0);
            eris_king_set_bg_prio(KING_BGPRIO_3,KING_BGPRIO_HIDE,KING_BGPRIO_HIDE,KING_BGPRIO_HIDE,0);
            eris_king_set_bg_mode(KING_BGMODE_4_PAL,0,0,0); eris_king_set_kram_pages(0,0,0,0);
            for(i=0;i<16;i++) microprog[i]=KING_CODE_NOP; microprog[0]=KING_CODE_BG0_CG_0;
            eris_king_disable_microprogram(); eris_king_write_microprogram(microprog,0,16); eris_king_enable_microprogram();
            eris_tetsu_set_palette(0,0x0000); eris_tetsu_set_palette(1,0xE0F0); eris_tetsu_set_palette(2,0xE088); eris_tetsu_set_palette(3,0xFFFF);
            eris_tetsu_set_video_mode(TETSU_LINES_262,0,TETSU_DOTCLOCK_5MHz,TETSU_COLORS_16,TETSU_COLORS_16,0,0,1,0,0,0,0);
            eris_king_set_bat_cg_addr(KING_BG0,0,0); eris_king_set_bat_cg_addr(KING_BG0SUB,0,0);
            eris_king_set_scroll(KING_BG0,0,0); eris_king_set_bg_size(KING_BG0,KING_BGSIZE_256,KING_BGSIZE_256,KING_BGSIZE_256,KING_BGSIZE_256);
            eris_king_set_kram_write(0,1); for(i=0;i<0x2000;i++) eris_king_kram_write(0);
            for(y=0;y<96;y++){ eris_king_set_kram_write((64+y)<<5,1); for(x=0;x<32;x++) eris_king_kram_write(screen_words[y*32+x]); }
            for(;;){} return 0;
          }
          ''')
          open('/tmp/liberis/examples/hello/hello.c','w',encoding='utf-8').write('\n'.join(out))
          PY
          cat >/tmp/liberis/examples/hello/cdlink.txt <<'EOF'
          binary ./out.bin
          name Cutey Honey FX KR POC01 v003
          maker KR POC by Kedori
          makerid KRP
          date 20260907
          country 1
          version 259
          EOF
      - name: Compile V810 program
        run: |
          export PATH="$V810GCC/bin:$PATH"
          make -C /tmp/liberis/examples/hello clean
          make -C /tmp/liberis/examples/hello -j2 all
          make -C /tmp/liberis/examples/hello cd
          test -s /tmp/liberis/examples/hello/hello_cd.bin
      - name: Rebuild raw sectors
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/base /tmp/pkg /tmp/go
          mkdir -p /tmp/base /tmp/pkg /tmp/go artifacts
          unzip -q artifacts/CuteyHoneyFX_KR_POC01_v0.01.zip -d /tmp/base
          python3 - <<'PY'
          import pathlib,struct,hashlib
          old=pathlib.Path('/tmp/base/poc01_raw_sectors.bin').read_bytes(); hb=pathlib.Path('/tmp/liberis/examples/hello/hello_cd.bin').read_bytes()
          sect_off,sect_count,load,entry=struct.unpack_from('<IIII',hb,0x820); used=sect_off+sect_count
          assert sect_off==2 and used==6 and load==0x8000 and entry==0x8000 and len(old)==6*2352
          edc_lut=[0]*256; ef=[0]*256; eb=[0]*256
          for i in range(256):
              edc=i; j=i<<1
              if j&0x100:j^=0x11D
              ef[i]=j; eb[i^j]=i
              for _ in range(8): edc=(edc>>1)^(0xD8018001 if edc&1 else 0)
              edc_lut[i]=edc&0xffffffff
          def edc(src):
              e=0
              for b in src:e=(e>>8)^edc_lut[(e^b)&255]
              return e&0xffffffff
          def ecc(src,maj,minc,mult,inc):
              size=maj*minc; out=bytearray(maj*2)
              for m in range(maj):
                  idx=(m>>1)*mult+(m&1); a=b=0
                  for _ in range(minc):
                      t=src[idx]; idx+=inc
                      if idx>=size:idx-=size
                      a^=t;b^=t;a=ef[a]
                  a=eb[ef[a]^b]; out[m]=a; out[m+maj]=a^b
              return out
          def fix(s):
              s[0x810:0x814]=struct.pack('<I',edc(s[:0x810])); s[0x814:0x81c]=b'\0'*8
              s[0x81c:0x8c8]=ecc(s[0x0c:0x0c+2064],86,24,2,86); s[0x8c8:0x930]=ecc(s[0x0c:0x0c+2236],52,43,86,88); return s
          new=bytearray()
          for k in range(used):
              s=bytearray(old[k*2352:(k+1)*2352]); s[16:2064]=hb[k*2048:(k+1)*2048]; new+=fix(s)
          pathlib.Path('/tmp/pkg/poc01_v003_raw_sectors.bin').write_bytes(new)
          print('PATCH_SHA256',hashlib.sha256(new).hexdigest())
          PY
      - name: Build Windows patcher and package
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/pkg/poc01_v003_raw_sectors.bin /tmp/go/
          cat >/tmp/go/go.mod <<'EOF'
          module cutey-v003
          go 1.20
          EOF
          cat >/tmp/go/main.go <<'EOF'
          package main
          import("bufio";"bytes";"crypto/sha1";_ "embed";"encoding/hex";"fmt";"io";"os";"path/filepath";"strings")
          //go:embed poc01_v003_raw_sectors.bin
          var patch []byte
          const t1size int64=9807840; const t2size int64=656549040
          const t1sha="ffae85763f581d312abb6b5096f6f7d62e771aae"; const t2sha="1dd574364e40cb90dd0ff25940fe8df9e6793edf"; const off int64=0x81330
          func pause(){fmt.Print("\nPress Enter to close...");bufio.NewReader(os.Stdin).ReadString('\n')}
          func hs(p string)(string,error){f,e:=os.Open(p);if e!=nil{return "",e};defer f.Close();h:=sha1.New();_,e=io.Copy(h,f);return hex.EncodeToString(h.Sum(nil)),e}
          func bysize(d string,n int64,skip string)[]string{es,_:=os.ReadDir(d);var r[]string;for _,x:=range es{if x.IsDir()||!strings.EqualFold(filepath.Ext(x.Name()),".bin"){continue};p:=filepath.Join(d,x.Name());if skip!=""&&strings.EqualFold(p,skip){continue};s,e:=x.Info();if e==nil&&s.Size()==n{r=append(r,p)}};return r}
          func main(){
            fmt.Println("Cutey Honey FX KR POC01 v0.03 - 8px WORD PIXEL FIX")
            ex,_:=os.Executable();d:=filepath.Dir(ex);c:=bysize(d,t2size,"");if len(c)!=1{fmt.Println("[ERROR] Put CLEAN Track 1/2 BINs with this EXE.");pause();return};t2:=c[0]
            fmt.Println("[1/5] Verify Track 2...");s,_:=hs(t2);if s!=t2sha{fmt.Println("[ERROR] Track 2 SHA-1",s);pause();return};fmt.Println("[PASS]")
            c=bysize(d,t1size,t2);if len(c)!=1{fmt.Println("[ERROR] Track 1 not found.");pause();return};t1:=c[0]
            fmt.Println("[2/5] Verify Track 1...");s,_=hs(t1);if s!=t1sha{fmt.Println("[ERROR] Track 1 SHA-1",s);pause();return};fmt.Println("[PASS]")
            dst:=filepath.Join(d,"Cutey Honey FX (Japan) (Track 2) [KR POC01 v0.03].bin")
            fmt.Println("[3/5] Copy Track 2...");i,_:=os.Open(t2);o,e:=os.Create(dst);if e!=nil{fmt.Println(e);pause();return};io.Copy(o,i);i.Close()
            fmt.Println("[4/5] Apply 6 raw sectors...");o.Seek(off,io.SeekStart);o.Write(patch);o.Close()
            v,_:=os.Open(dst);v.Seek(off,io.SeekStart);b:=make([]byte,len(patch));io.ReadFull(v,b);v.Close();if !bytes.Equal(b,patch){fmt.Println("[ERROR] readback failed");pause();return}
            cue:=fmt.Sprintf("FILE \"%s\" BINARY\r\n  TRACK 01 AUDIO\r\n    INDEX 01 00:00:00\r\nFILE \"%s\" BINARY\r\n  TRACK 02 MODE1/2352\r\n    INDEX 00 00:00:00\r\n    INDEX 01 00:03:00\r\n",filepath.Base(t1),filepath.Base(dst))
            cp:=filepath.Join(d,"Cutey Honey FX (Japan) [KR POC01 v0.03].cue");os.WriteFile(cp,[]byte(cue),0644)
            fmt.Println("[5/5] [PASS] Created:",cp);fmt.Println("Expected: 한글 출력 성공 / CUTIE HONEY FX / KR POC01 v0.03");pause()
          }
          EOF
          cd /tmp/go
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/pkg/POC01_v003_WORD_PIXEL_FIX_Patcher.exe .
          cp /tmp/expected.png /tmp/pkg/EXPECTED_NORMAL.png
          cat >/tmp/pkg/README_KO.txt <<'EOF'
          큐티하니 FX POC01 v0.03
          v0.01: 8픽셀 워드 내부가 좌우반전됨.
          v0.02: 전체 256픽셀을 반전해 문자열 순서까지 뒤집힘.
          v0.03: 전체 반전은 제거하고 각 16비트 워드의 8픽셀만 역순 패킹.
          CLEAN Track 1/2와 EXE를 같은 폴더에 두고 EXE를 실행한 뒤 생성된 v0.03 CUE로 부팅하세요.
          EOF
          (cd /tmp/pkg && sha256sum * > SHA256SUMS.txt)
          rm -f "$GITHUB_WORKSPACE/artifacts/CuteyHoneyFX_KR_POC01_SPLIT_v0.03_WORD_PIXEL_FIX.zip"
          (cd /tmp/pkg && zip -9 -r "$GITHUB_WORKSPACE/artifacts/CuteyHoneyFX_KR_POC01_SPLIT_v0.03_WORD_PIXEL_FIX.zip" .)
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CuteyHoneyFX_KR_POC01_SPLIT_v0.03_WORD_PIXEL_FIX
          path: artifacts/CuteyHoneyFX_KR_POC01_SPLIT_v0.03_WORD_PIXEL_FIX.zip
          retention-days: 7
      - name: Commit package
        run: |
          git config user.name 'Cutey POC Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/CuteyHoneyFX_KR_POC01_SPLIT_v0.03_WORD_PIXEL_FIX.zip
          git commit -m 'artifact: Cutey POC01 v0.03 word pixel fix [skip ci]'
          git push origin HEAD:tmp-cutey-poc01