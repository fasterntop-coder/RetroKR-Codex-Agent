name: Cutey Honey FX POC03 First Voice Pinpoint v7
permissions:
  contents: write
on:
  push:
    branches: [tmp-cutey-poc01]
    paths: ['.github/workflows/cutey_early_voice_pinpoint_v7.yml']
  workflow_dispatch:
jobs:
  pinpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp-cutey-poc01}
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake pkg-config libsdl2-dev libflac-dev libsndfile1-dev liblzo2-dev libmpcdec-dev libzstd-dev zlib1g-dev gettext p7zip-full curl python3 git
      - name: build emucap
        run: |
          set -euxo pipefail
          git clone -q https://github.com/mcpads/emucap.git /tmp/emucap
          cd /tmp/emucap && git checkout -q 3887f9e9de7525087c30ca4434d9cb8c3ff15103
          adapters/mednafen/build.sh
      - name: clean parent
        run: |
          set -euxo pipefail
          curl -L --retry 3 --fail -o /tmp/cutey.7z 'https://archive.org/download/noaen-redump-nec-pc-fx-pc-fxga/Cutey%20Honey%20FX%20%28Japan%29.7z'
          mkdir -p /tmp/game /tmp/v7 analysis/cutey_full/early_voice_v7
          7z x -y /tmp/cutey.7z -o/tmp/game >/dev/null
          T1=$(find /tmp/game -maxdepth 1 -type f -name '*Track 1*.bin' | head -1); T2=$(find /tmp/game -maxdepth 1 -type f -name '*Track 2*.bin' | head -1)
          echo 'ffae85763f581d312abb6b5096f6f7d62e771aae  '"$T1" | sha1sum -c -
          echo '1dd574364e40cb90dd0ff25940fe8df9e6793edf  '"$T2" | sha1sum -c -
          B1=$(basename "$T1"); B2=$(basename "$T2")
          printf 'FILE "%s" BINARY\n  TRACK 01 AUDIO\n    INDEX 01 00:00:00\nFILE "%s" BINARY\n  TRACK 02 MODE1/2352\n    INDEX 00 00:00:00\n    INDEX 01 00:03:00\n' "$B1" "$B2" >/tmp/game/game.cue
          curl -L --retry 3 --fail -o /tmp/pcfx.rom https://raw.githubusercontent.com/Abdess/retrobios/master/bios/NEC/PC-FX/pcfx.rom
          echo '4b44ccf5d84cc83daa2e6a2bee00fdafa14eb58bdf5859e96d8861a891675417  /tmp/pcfx.rom' | sha256sum -c -
      - name: pinpoint trigger instruction
        run: |
          cat >/tmp/v7/pin.py <<'PY'
          import socket,subprocess,os,json,time,traceback
          from pathlib import Path
          ROOT='/tmp/emucap'; CUE='/tmp/game/game.cue'; OUT=Path('/tmp/v7'); port=47800
          srv=socket.socket();srv.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1);srv.bind(('127.0.0.1',port));srv.listen(1);srv.settimeout(120)
          env=os.environ.copy();env.update({'EMUCAP_PCFX_BIOS':'/tmp/pcfx.rom','MEDNAFEN_FORCE_MODULE':'pcfx','EMUCAP_HEADLESS':'1','EMUCAP_START_FROZEN':'1','SDL_VIDEODRIVER':'dummy','SDL_AUDIODRIVER':'dummy'})
          log=open(OUT/'mednafen.log','w');p=subprocess.Popen([ROOT+'/adapters/mednafen/launch.sh',CUE,str(port)],cwd=ROOT+'/adapters/mednafen',env=env,stdout=log,stderr=subprocess.STDOUT)
          result={}
          try:
            c,_=srv.accept();c.settimeout(90);f=c.makefile('rwb',buffering=0);rid=[0]
            def req(m,pms=None):
              rid[0]+=1;i=rid[0];f.write((json.dumps({'v':1,'id':i,'method':m,'params':pms or {}},separators=(',',':'))+'\n').encode())
              while True:
                v=json.loads(f.readline())
                if v.get('id')!=i: continue
                if not v.get('ok'): raise RuntimeError(m+':'+json.dumps(v))
                return v.get('result')
            def wait():
              for _ in range(500):
                s=req('status',{})
                if str(s.get('state','')).lower() in ('frozen','paused','stopped'): return s
                time.sleep(.01)
              raise TimeoutError('freeze')
            def frames(n): req('step',{'frames':n}); return wait()
            def ins(n): req('step_instructions',{'count':n}); return wait()
            def aud():
              r=req('get_state',{'groups':['g4','SndBox']}); st=r.get('state',r)
              return {k:st.get(k) for k in ['g4.ADPCMCTRL','g4.ADPCMPA0','g4.ADPCMEA0','g4.ADPCMStat','SndBox.CH0LVol','SndBox.CH0RVol']},st
            hello=req('hello',{}); result['identity']={'build':hello.get('build'),'system':hello.get('system')}
            frames(720); req('set_input',{'port':0,'buttons':['run']});frames(3);req('set_input',{'port':0,'buttons':[]});frames(2)
            # v6 found first strong playback start around +570 frames. Walk to exact frame.
            frames(520)
            prev,_=aud(); exact=None
            for rel in range(521,621):
              req('save_state',{'path':'/tmp/v7/pre.mcstate'}); wait()
              frames(1); cur,full=aud()
              if cur.get('g4.ADPCMCTRL')!=prev.get('g4.ADPCMCTRL') or (cur.get('g4.ADPCMPA0') not in (prev.get('g4.ADPCMPA0'),None) and cur.get('g4.ADPCMCTRL')==5):
                exact=rel; result['frame_transition']={'relative_frame':rel,'before':prev,'after':cur,'state_after':full}; break
              prev=cur
            if exact is None: raise RuntimeError('no target transition in 521..620')
            # pre.mcstate is state immediately before the triggering frame.
            req('load_state',{'path':'/tmp/v7/pre.mcstate'});wait(); before,_=aud()
            req('set_trace',{'enabled':True})
            # Coarse instruction search inside one frame; keep a checkpoint before each block.
            found=False
            for blk in range(1,401):
              req('save_state',{'path':'/tmp/v7/block.mcstate'});wait()
              b,_=aud(); ins(250); a,_=aud()
              if a.get('g4.ADPCMCTRL')!=b.get('g4.ADPCMCTRL'):
                result['block']={'index':blk,'before':b,'after':a}
                req('load_state',{'path':'/tmp/v7/block.mcstate'});wait(); req('set_trace',{'enabled':True})
                prev2,_=aud()
                for j in range(1,301):
                  ins(1); now,_=aud()
                  if now.get('g4.ADPCMCTRL')!=prev2.get('g4.ADPCMCTRL'):
                    tr=req('get_trace',{'count':64}); cs=req('call_stack',{})
                    result['instruction_hit']={'step':j,'before':prev2,'after':now,'trace':tr,'call_stack':cs,'status':req('status',{})}
                    # dump broad boot RAM context; later builder maps PC into boot sectors.
                    result['ram_0x8000_0x80000']=req('read_memory',{'memory_type':'ram','address':0x8000,'length':0x78000})
                    found=True;break
                  prev2=now
                break
            if not found: raise RuntimeError('instruction trigger not found')
          except Exception as e:
            result['fatal']=repr(e); result['traceback']=traceback.format_exc(); raise
          finally:
            (OUT/'PINPOINT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
            try:c.close();srv.close()
            except:pass
            try:p.terminate();p.wait(timeout=5)
            except:
              try:p.kill()
              except:pass
            log.close()
          PY
          python3 /tmp/v7/pin.py
      - name: stage
        if: always()
        run: |
          cp /tmp/v7/PINPOINT.json analysis/cutey_full/early_voice_v7/ 2>/dev/null || true
          tail -300 /tmp/v7/mednafen.log > analysis/cutey_full/early_voice_v7/MEDNAFEN_LOG.txt 2>/dev/null || true
          git config user.name 'Cutey POC03 tracer'; git config user.email 'actions@users.noreply.github.com'
          git add analysis/cutey_full/early_voice_v7/*.json analysis/cutey_full/early_voice_v7/*.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'analysis: pinpoint first voice trigger v7 [skip ci]'
          git pull --rebase origin tmp-cutey-poc01 || true; git push origin HEAD:tmp-cutey-poc01 || true
      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: CuteyHoneyFX_POC03_PINPOINT_v7, path: analysis/cutey_full/early_voice_v7}
