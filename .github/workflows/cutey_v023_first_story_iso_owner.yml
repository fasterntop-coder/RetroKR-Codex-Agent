name: Cutey Honey FX v0.23 First Story ISO Owner
permissions:
  contents: write
on:
  push:
    branches: [tmp-cutey-poc01]
    paths: ['.github/workflows/cutey_v023_first_story_iso_owner.yml']
  workflow_dispatch:
jobs:
  map-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp-cutey-poc01}
      - name: Prepare exact CLEAN Track2
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full curl python3
          curl -L --retry 3 --fail -o /tmp/cutey.7z 'https://archive.org/download/noaen-redump-nec-pc-fx-pc-fxga/Cutey%20Honey%20FX%20%28Japan%29.7z'
          mkdir -p /tmp/game /tmp/v023 analysis/cutey_full/v023_first_story_iso_owner
          7z x -y /tmp/cutey.7z -o/tmp/game >/dev/null
          T2=$(find /tmp/game -maxdepth 1 -type f -name '*Track 2*.bin' | head -1)
          echo '1dd574364e40cb90dd0ff25940fe8df9e6793edf  '"$T2" | sha1sum -c -
          echo "$T2" >/tmp/v023/t2path
      - name: Map exact story occurrences to ISO9660 owning files
        run: |
          python3 - <<'PY'
          import json,struct,hashlib
          from pathlib import Path
          p=Path(Path('/tmp/v023/t2path').read_text().strip())
          raw=p.read_bytes(); SS=2352; UOFF=16; US=2048
          texts=['船の乗客で混雑している。','正面に見えるのが、ゲスト登録の','受け付けみたいだ。']
          pvd_raw=None
          for sec in range(min(len(raw)//SS,4000)):
              u=raw[sec*SS+UOFF:sec*SS+UOFF+US]
              if len(u)>=7 and u[0]==1 and u[1:6]==b'CD001' and u[6]==1:
                  pvd_raw=sec; break
          if pvd_raw is None: raise SystemExit('ISO9660 PVD not found')
          iso_base_raw_sector=pvd_raw-16
          def user_sector(lba):
              rs=iso_base_raw_sector+lba
              return raw[rs*SS+UOFF:rs*SS+UOFF+US]
          pvd=user_sector(16)
          root=pvd[156:190]
          root_extent=struct.unpack_from('<I',root,2)[0]
          root_size=struct.unpack_from('<I',root,10)[0]
          files=[]; seen=set()
          def read_extent(ext,size):
              out=bytearray()
              for i in range((size+US-1)//US): out+=user_sector(ext+i)
              return bytes(out[:size])
          def walk_dir(ext,size,prefix=''):
              key=(ext,size)
              if key in seen: return
              seen.add(key); data=read_extent(ext,size); pos=0
              while pos < len(data):
                  ln=data[pos]
                  if ln==0:
                      pos=((pos//US)+1)*US; continue
                  rec=data[pos:pos+ln]
                  if len(rec)<34: break
                  rext=struct.unpack_from('<I',rec,2)[0]; rsize=struct.unpack_from('<I',rec,10)[0]
                  flags=rec[25]; nlen=rec[32]; nameb=rec[33:33+nlen]
                  if nameb not in (b'\x00',b'\x01'):
                      name=nameb.decode('ascii','replace').split(';')[0]
                      full=(prefix+'/'+name).replace('//','/')
                      if flags & 2: walk_dir(rext,rsize,full)
                      else: files.append({'path':full,'iso_extent_lba':rext,'size':rsize})
                  pos+=ln
          walk_dir(root_extent,root_size,'')
          # Search reconstructed ISO file bytes, not the whole MODE1/2352 stream.
          file_hits=[]
          for f in files:
              data=read_extent(f['iso_extent_lba'],f['size'])
              for text in texts:
                  b=text.encode('shift_jis'); start=0
                  while True:
                      off=data.find(b,start)
                      if off<0: break
                      lba=f['iso_extent_lba'] + off//US
                      in_user=off%US
                      raw_sector=iso_base_raw_sector+lba
                      raw_offset=raw_sector*SS+UOFF+in_user
                      file_hits.append({'text':text,'owner_path':f['path'],'owner_extent_lba':f['iso_extent_lba'],'owner_file_offset':off,'iso_lba':lba,'raw_sector':raw_sector,'raw_offset':raw_offset,'raw_hex':hex(raw_offset)})
                      start=off+1
          # Independently keep raw-stream hits only as diagnostics; never treat header/ECC hits as ISO-owned.
          raw_hits=[]
          for text in texts:
              b=text.encode('shift_jis'); start=0
              while True:
                  i=raw.find(b,start)
                  if i<0: break
                  raw_hits.append({'text':text,'raw_offset':i,'raw_hex':hex(i),'raw_sector':i//SS,'in_sector':i%SS,'in_mode1_user_data':UOFF <= (i%SS) < UOFF+US})
                  start=i+1
          owners={}
          for h in file_hits:
              g=owners.setdefault(h['owner_path'],{'extent_lba':h['owner_extent_lba'],'occurrences':[]})
              g['occurrences'].append(h)
          summary=[]
          for path,g in sorted(owners.items()):
              summary.append({'path':path,'extent_lba':g['extent_lba'],'hit_count':len(g['occurrences']),'file_offsets':sorted({x['owner_file_offset'] for x in g['occurrences']}),'raw_sectors':sorted({x['raw_sector'] for x in g['occurrences']})})
          out={'clean_track2_sha1':hashlib.sha1(raw).hexdigest(),'pvd_raw_sector':pvd_raw,'iso_base_raw_sector':iso_base_raw_sector,'root_extent_lba':root_extent,'file_count':len(files),'file_hits':file_hits,'raw_hits_diagnostic':raw_hits,'owners':owners}
          Path('/tmp/v023/ISO_OWNER_MAP.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('/tmp/v023/OWNER_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'pvd_raw_sector':pvd_raw,'iso_base_raw_sector':iso_base_raw_sector,'file_count':len(files),'owners':summary,'raw_hit_count':len(raw_hits)},ensure_ascii=False,indent=2))
          if not file_hits: raise SystemExit('no ISO file contains verified first-story Shift-JIS bytes')
          PY
      - name: Stage evidence
        if: always()
        run: |
          cp /tmp/v023/ISO_OWNER_MAP.json analysis/cutey_full/v023_first_story_iso_owner/ 2>/dev/null || true
          cp /tmp/v023/OWNER_SUMMARY.json analysis/cutey_full/v023_first_story_iso_owner/ 2>/dev/null || true
          git config user.name 'Cutey v0.23 ISO owner mapper'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/cutey_full/v023_first_story_iso_owner
          git diff --cached --quiet || git commit -m 'analysis: add v0.23 first story ISO ownership evidence [skip ci]'
          git pull --rebase origin tmp-cutey-poc01 || true
          git push origin HEAD:tmp-cutey-poc01 || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CuteyHoneyFX_v023_first_story_iso_owner
          path: analysis/cutey_full/v023_first_story_iso_owner
