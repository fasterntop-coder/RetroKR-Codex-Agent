name: emucap bootstrap Windows

on:
  push:
    branches:
      - emucap-bootstrap-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Checkout emucap 0.16.1 source
        shell: pwsh
        run: |
          git clone https://github.com/mcpads/emucap.git emucap-src
          git -C emucap-src checkout 3887f9e9de7525087c30ca4434d9cb8c3ff15103
          if ((git -C emucap-src rev-parse HEAD).Trim() -ne '3887f9e9de7525087c30ca4434d9cb8c3ff15103') { throw 'emucap commit mismatch' }

      - name: Select current stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Ensure .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build emucap NES core MCPs
        working-directory: emucap-src
        shell: pwsh
        run: |
          cargo build --locked --release --bin emucap --bin emucap-mcp --bin emucap-track-mcp --bin emucap-broker

      - name: Build emucap-compatible MesenCE
        working-directory: emucap-src
        shell: pwsh
        run: |
          $env:CL = '/D_CRT_SECURE_NO_WARNINGS'
          $buildScript = '.\adapters\mesen2\build.ps1'
          $text = Get-Content -Raw -LiteralPath $buildScript
          $needle = '    Write-Host "Building MesenCE locally with Visual Studio Release/x64"'
          if (-not $text.Contains($needle)) { throw 'Mesen build insertion point not found' }
          $insert = @'
              Write-Host "Restoring MesenCE UI NuGet packages"
              Invoke-Native "dotnet" @("restore", (Join-Path $Source "UI/UI.csproj"))

          '@
          $text = $text.Replace($needle, $insert + $needle)
          Set-Content -LiteralPath $buildScript -Value $text -Encoding UTF8
          .\adapters\mesen2\build.ps1

      - name: Assemble portable runtime bundle
        shell: pwsh
        run: |
          $src = (Resolve-Path 'emucap-src').Path
          $dst = Join-Path $PWD 'emucap-runtime-windows'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          robocopy $src $dst /E /XD .git target adapters\mesen2\work | Out-Null
          if ($LASTEXITCODE -gt 7) { throw "robocopy source tree failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path (Join-Path $dst 'target\release') | Out-Null
          Copy-Item "$src\target\release\emucap.exe" "$dst\target\release\"
          Copy-Item "$src\target\release\emucap-mcp.exe" "$dst\target\release\"
          Copy-Item "$src\target\release\emucap-track-mcp.exe" "$dst\target\release\"
          Copy-Item "$src\target\release\emucap-broker.exe" "$dst\target\release\"
          $mesen = Get-ChildItem -Recurse -File -Filter 'Mesen.exe' "$src\adapters\mesen2\work\mesen\bin\win-x64\Release" | Select-Object -First 1
          if (-not $mesen) { throw 'Mesen.exe not found after build' }
          $mesenRoot = $mesen.DirectoryName
          $rel = $mesenRoot.Substring($src.Length).TrimStart('\')
          $mesenDst = Join-Path $dst $rel
          New-Item -ItemType Directory -Force -Path $mesenDst | Out-Null
          robocopy $mesenRoot $mesenDst /E | Out-Null
          if ($LASTEXITCODE -gt 7) { throw "robocopy Mesen runtime failed: $LASTEXITCODE" }
          @'
          @echo off
          setlocal
          set ROOT=%~dp0
          codex mcp add emucap --env "EMUCAP_REPO_ROOT=%ROOT:~0,-1%" -- "%ROOT%target\release\emucap-mcp.exe"
          if errorlevel 1 exit /b %errorlevel%
          codex mcp add emucap-track -- "%ROOT%target\release\emucap-track-mcp.exe"
          if errorlevel 1 exit /b %errorlevel%
          echo DONE. Reconnect/restart Codex.
          pause
          '@ | Set-Content -Encoding ASCII (Join-Path $dst 'REGISTER_CODEX_MCP.cmd')

      - name: Upload Windows emucap runtime
        uses: actions/upload-artifact@v4
        with:
          name: emucap-0.16.1-windows-runtime
          path: emucap-runtime-windows
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libsdl2-dev rsync zip

      - name: Checkout emucap 0.16.1 source
        shell: bash
        run: |
          git clone https://github.com/mcpads/emucap.git emucap-src
          git -C emucap-src checkout 3887f9e9de7525087c30ca4434d9cb8c3ff15103
          test "$(git -C emucap-src rev-parse HEAD)" = "3887f9e9de7525087c30ca4434d9cb8c3ff15103"

      - name: Select current stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Ensure .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build emucap NES core MCPs
        working-directory: emucap-src
        shell: bash
        run: |
          cargo build --locked --release --bin emucap --bin emucap-mcp --bin emucap-track-mcp --bin emucap-broker

      - name: Build self-contained emucap-compatible MesenCE
        working-directory: emucap-src
        shell: bash
        run: |
          export PUBLISHFLAGS='-r linux-x64 -p:SelfContained=true -p:PublishSingleFile=false'
          ./adapters/mesen2/build.sh

      - name: Assemble portable Linux runtime bundle
        shell: bash
        run: |
          src="$PWD/emucap-src"
          dst="$PWD/emucap-runtime-linux"
          mkdir -p "$dst/target/release"
          rsync -a --exclude '.git' --exclude 'target' --exclude 'adapters/mesen2/work' "$src/" "$dst/"
          cp "$src/target/release/emucap" "$dst/target/release/"
          cp "$src/target/release/emucap-mcp" "$dst/target/release/"
          cp "$src/target/release/emucap-track-mcp" "$dst/target/release/"
          cp "$src/target/release/emucap-broker" "$dst/target/release/"
          mesen="$(find "$src/adapters/mesen2/work/mesen/bin" -path '*/publish/Mesen' -type f -perm -111 | head -1)"
          if [ -z "$mesen" ]; then echo 'Mesen binary not found after build' >&2; exit 1; fi
          mesen_root="$(dirname "$mesen")"
          rel="${mesen_root#$src/}"
          mkdir -p "$dst/$rel"
          rsync -a "$mesen_root/" "$dst/$rel/"
          sha256sum "$dst/target/release/emucap-mcp"
          sha256sum "$dst/target/release/emucap-track-mcp"
          sha256sum "$mesen"

      - name: Upload Linux emucap runtime
        uses: actions/upload-artifact@v4
        with:
          name: emucap-0.16.1-linux-runtime
          path: emucap-runtime-linux
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
